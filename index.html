<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>레퍼런스 로그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 편집실 로그북. SMPTE 컬러바 → 최근 28일 스트립 → 날짜별 카드 그리드 → 큰 플레이어 / 더 찾기 창. 사이트별 색은 컬러바에서 가져온다. */
:root {
  color-scheme: light;
  --bg: #EDEFF2; --surface: #FFFFFF; --surface-2: #F4F5F8; --ink: #14171D; --muted: #586070;
  --line: #D6DAE1; --accent: #2D4BFF; --danger: #C2362F;
  --p-youtube: #E5484D; --p-vimeo: #12A6C9; --p-tvcf: #3E63DD; --p-other: #2FA86B;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1014; --surface: #161A20; --surface-2: #1D222A; --ink: #EDF0F5; --muted: #9AA3B3;
    --line: #2A303A; --accent: #8397FF; --danger: #FF7B72;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bars { display: flex; height: 8px; }
.bars i { flex: 1; display: block; }
.bars i:nth-child(1) { background: #D9D9D9; } .bars i:nth-child(2) { background: #E7D23B; } .bars i:nth-child(3) { background: #28B8D5; }
.bars i:nth-child(4) { background: #2FA86B; } .bars i:nth-child(5) { background: #D6409F; } .bars i:nth-child(6) { background: #E5484D; } .bars i:nth-child(7) { background: #3E63DD; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 64px; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stamp { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.6; }
.stamp b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; }
.notice { margin: 0 0 8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 13px; color: var(--muted); }
.notice b { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; color: var(--ink); margin-right: 8px; }

.launch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.launch .lbl { margin-right: 4px; }
.src { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px; }
.src:hover { border-color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; display: inline-block; }

.intake { display: flex; gap: 8px; flex-wrap: wrap; }
.intake input { flex: 1 1 260px; min-width: 0; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.intake input::placeholder { color: var(--muted); }
.intake input:focus-visible { border-color: var(--accent); outline-offset: 0; }
.btn { height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:disabled, .btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.intake .btn { height: 46px; }

.stripWrap { display: flex; flex-direction: column; gap: 6px; }
.stripHead { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
.day { flex: none; width: 52px; padding: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.day:hover { border-color: var(--ink); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day .mo { height: 14px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.day[aria-pressed="true"] .mo, .day[aria-pressed="true"] .wd { color: inherit; opacity: .8; }
.day .wd { font-size: 11px; color: var(--muted); }
.day .dn { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.day .ticks { display: flex; gap: 2px; height: 5px; margin-top: 4px; }
.day .ticks i { display: block; width: 5px; height: 5px; border-radius: 1px; }
.day.empty { opacity: .6; }
.day.today .wd { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.day[aria-pressed="true"].today .wd { color: inherit; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search:focus-visible { border-color: var(--accent); outline-offset: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { height: 38px; padding: 0 14px; border: 0; background: transparent; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.favBtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.facets { display: flex; flex-direction: column; gap: 8px; }
.facet { display: flex; gap: 10px; align-items: baseline; }
.facet .lbl { flex: none; width: 56px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .cnt { font-family: var(--font-mono); font-size: 11px; opacity: .65; }

.groups { display: flex; flex-direction: column; gap: 34px; }
.group { display: flex; flex-direction: column; gap: 14px; }
.ghead { display: flex; align-items: flex-end; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.ghead h2 { margin: 0; display: flex; align-items: flex-end; gap: 12px; font-weight: 600; font-size: 20px; line-height: 1.1; }
.gnum { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: .85; letter-spacing: .01em; }
.gmeta { display: flex; flex-direction: column; gap: 2px; font-size: 14px; padding-bottom: 2px; }
.gmeta .mono { font-size: 11px; color: var(--muted); font-weight: 400; }
.gname { display: inline-flex; align-items: center; gap: 10px; }
.gcount { margin-left: auto; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.todayTag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; padding: 2px 6px; background: var(--ink); color: var(--bg); border-radius: 3px; align-self: center; }
.sublist { display: flex; flex-direction: column; gap: 10px; }
.subhead { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.subhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.subhead b { color: var(--ink); font-weight: 600; font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.media { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; background: var(--surface-2); text-decoration: none; overflow: hidden; cursor: pointer; text-align: left; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); z-index: 1; }
.ph { height: 100%; padding: 16px 14px 10px; display: flex; flex-direction: column; justify-content: space-between; }
.ph .pl { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; word-break: break-word; }
.ph .pp { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.num { position: absolute; left: 8px; bottom: 8px; z-index: 2; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink); }
.dur { position: absolute; right: 8px; top: 12px; z-index: 2; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(15, 17, 21, .78); color: #fff; }
.playbtn { position: absolute; right: 10px; bottom: 10px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: rgba(15, 17, 21, .78); display: grid; place-items: center; }
.playbtn::after { content: ""; margin-left: 4px; border-style: solid; border-width: 8px 0 8px 13px; border-color: transparent transparent transparent #fff; }
.media:hover .playbtn { background: var(--c); }
.cbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.ctitle { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ctitle.untitled { color: var(--muted); font-weight: 500; }
.credit { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.cat { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); }
.cdate { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tags { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.acts { display: flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
.go { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; }
.go.alt { background: transparent; color: var(--ink); }
.go:hover { opacity: .85; }
.go:disabled { opacity: .5; cursor: default; }
.ib { height: 32px; min-width: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer; font-size: 13px; }
.ib:hover { border-color: var(--ink); }
.ib[aria-pressed="true"] { color: #C98A0B; border-color: #C98A0B; }
.acts .sp { flex: 1; }
.acts select { height: 32px; max-width: 100%; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12px; }

.empty { margin: 0; padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; background: var(--surface); }
.empty h2 { margin: 0 0 6px; color: var(--ink); font-size: 17px; font-weight: 600; }
.empty p { margin: 0 auto 14px; max-width: 46ch; }

dialog { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); overflow: auto; }
dialog::backdrop { background: rgba(8, 10, 14, .62); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dhead h2 { margin: 0; font-size: 18px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; font-weight: 500; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }
.field input:disabled, .field textarea:disabled { opacity: .5; }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { border-color: var(--accent); outline-offset: 0; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; min-height: 18px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 12px; }
.quick button:hover { border-color: var(--ink); }
.err { margin: 0; color: var(--danger); font-size: 13px; }
.dfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dfoot .grow { flex: 1; }

#pdlg, #sdlg { width: min(1040px, calc(100vw - 24px)); background: var(--bg); }
.pbox, .sbox { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.phead { display: flex; align-items: flex-start; gap: 12px; }
.phead .tt { flex: 1; min-width: 0; }
.phead h2 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.plink { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; min-width: 0; }
.plink a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.plink a:hover { color: var(--ink); }
.phead .cr { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.stage { width: 100%; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pnote { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.fail { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.pfoot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pfoot .grow { flex: 1; }
.pfoot .pos { font-size: 12px; color: var(--muted); }

.setup { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.setup h3 { margin: 0; font-size: 15px; font-weight: 600; }
.setup ol { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.setup .row { display: flex; gap: 8px; flex-wrap: wrap; }
.setup input { flex: 1 1 240px; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.setup .lbl2 { font-size: 12px; font-weight: 500; color: var(--muted); }
.ctrl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.ctrl .lbl { margin-right: -6px; }
.smsg { margin: 0; font-size: 13px; color: var(--muted); min-height: 20px; }
.smsg.bad { color: var(--danger); }
.sfoot { display: flex; justify-content: center; }
.rviews { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* ---- 스트림: 크기가 같은 영상이 세로로 이어지고, 화면 가운데에 온 하나만 커진다 ---- */
body[data-mode="stream"] { color-scheme: dark; --bg: #000; --surface: #000; --surface-2: #15171b; --ink: #f2f2f2; --muted: #8d929c; --line: #2b2e34; --accent: #9db0ff; background: #000; color: var(--ink); }
body[data-mode="stream"] > .bars, body[data-mode="stream"] #logView { display: none; }
body[data-mode="log"] #stream { display: none; }
html:has(body[data-mode="stream"]) { scroll-snap-type: y proximity; }
#stream { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; min-height: 100vh; }
.stTop { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 22px; padding: 14px 22px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(6px); }
.stTop .mark { font-weight: 500; font-size: 14px; letter-spacing: .06em; }
.stTop nav { display: flex; gap: 18px; flex: none; }
.lk { border: 0; padding: 0; background: none; cursor: pointer; text-transform: inherit; letter-spacing: inherit; font-family: inherit; font-size: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lk:hover { color: var(--accent); }
.sbar { display: contents; }
.rail { position: fixed; left: 22px; top: 50%; transform: translateY(-50%); z-index: 15; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; max-width: 230px; }
.rail button { border: 0; padding: 2px 0; background: none; cursor: pointer; text-align: left; font-family: var(--font-mono); font-size: 14px; letter-spacing: .02em; color: var(--muted); opacity: .75; text-transform: uppercase; }
.rail button:hover { color: var(--ink); opacity: 1; }
.rail button[aria-pressed="true"] { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; color: var(--ink); opacity: 1; letter-spacing: .01em; margin: 2px 0; }
.rail button.sub { font-size: 12px; margin: 0 0 0 14px; padding: 1px 0; font-family: var(--font-mono); font-weight: 400; line-height: 1.5; }
.rail button.sub[aria-pressed="true"] { color: var(--ink); opacity: 1; text-decoration: underline; text-underline-offset: 3px; font-size: 12px; margin: 0 0 0 14px; font-family: var(--font-mono); font-weight: 500; letter-spacing: .02em; }
.sCol { max-width: 1100px; margin: 0 auto; padding: calc(50vh - 150px) 16px calc(50vh - 120px); display: flex; flex-direction: column; align-items: center; gap: 130px; }
.fig { margin: 0; width: min(520px, 62vw); flex: none; scroll-snap-align: center; transform-origin: center; transform: scale(1); opacity: .4; }
.fig.on { transform: scale(1.5); opacity: 1; z-index: 2; position: relative; }
.fig .sf { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; background: var(--surface-2); overflow: hidden; cursor: pointer; text-decoration: none; }
.fig .sf img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fig .sf .ph { padding: 14px; }
.fig.on .sf:hover::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 30px; background: rgba(10, 12, 16, .28); }
.fig figcaption { display: flex; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 11px; color: var(--muted); }
.fig figcaption .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; opacity: 0; }
.fig.on figcaption .t { opacity: 1; }
.stDates { flex: 1; min-width: 0; display: flex; justify-content: flex-start; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.stDates button { flex: none; border: 0; padding: 2px 0; background: none; cursor: pointer; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); white-space: nowrap; }
.stDates button:hover { color: var(--ink); }
.stDates button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; font-weight: 500; }
.stEmpty { padding: 20px 0; text-align: center; color: var(--muted); }
.stNote { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); margin: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-transform: none; letter-spacing: 0; line-height: 1.5; color: var(--muted); font-family: var(--font-body); font-size: 12.5px; z-index: 5; }

<body>

<div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div id="stream" aria-label="스트림">
  <div class="stTop">
    <div class="stDates" id="stDates" role="group" aria-label="날짜 선택"></div>
    <nav>
      <button type="button" class="lk" id="stLog">로그</button>
      <button type="button" class="lk" id="stAdd">+ 추가</button>
      <button type="button" class="lk" id="stFind">✦ 더 찾기</button>
    </nav>
  </div>
  <div class="sbar">
    <div class="rail" id="sRail" role="group" aria-label="카테고리"></div>
  </div>
  <div class="sCol" id="sCol"></div>
</div>

<div class="wrap" id="logView">
  <header class="top">
    <div>
      <h1>레퍼런스 로그</h1>
      <p class="sub">뮤직비디오 · 광고 · 시네마틱 필름 · 모션그래픽을 날짜별로 쌓아 두고 바로 재생하는 편집실 기록장</p>
    </div>
    <div class="stamp mono" aria-live="polite">
      <b id="todayLabel"></b>
      <span id="stats"></span>
      <button type="button" class="btn small" id="toStream" style="margin-top:6px">← 스트림 보기</button>
    </div>
  </header>

  <div id="notices"></div>

  <section class="launch" aria-label="오늘 둘러볼 사이트">
    <span class="lbl">오늘 둘러보기</span>
    <a class="src" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><i class="dot" style="--c:var(--p-youtube)"></i>YouTube ↗</a>
    <a class="src" href="https://vimeo.com/channels/staffpicks" target="_blank" rel="noopener noreferrer"><i class="dot" style="--c:var(--p-vimeo)"></i>Vimeo 스태프픽 ↗</a>
    <a class="src" href="https://www.tvcf.co.kr/" target="_blank" rel="noopener noreferrer"><i class="dot" style="--c:var(--p-tvcf)"></i>TVCF ↗</a>
  </section>

  <form class="intake" id="intake" autocomplete="off">
    <label class="sr" for="linkIn">영상 링크 붙여넣기</label>
    <input id="linkIn" type="text" inputmode="url" placeholder="영상 링크를 붙여넣고 Enter (YouTube, Vimeo, TVCF …)">
    <button type="submit" class="btn primary">추가</button>
    <button type="button" class="btn" id="findBtn">✦ 더 찾기</button>
  </form>

  <section class="stripWrap" aria-label="날짜별 기록">
    <div class="stripHead">
      <span class="lbl">최근 28일</span>
      <button type="button" class="btn ghost small" id="clearDate" hidden>날짜 필터 해제</button>
    </div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="tools" aria-label="검색과 보기 방식">
    <label class="sr" for="q">검색</label>
    <input class="search" id="q" type="search" placeholder="제목, 감독, 태그, 메모 검색">
    <div class="seg" role="group" aria-label="묶는 기준">
      <button type="button" data-g="date" aria-pressed="true">날짜별</button>
      <button type="button" data-g="category" aria-pressed="false">카테고리별</button>
      <button type="button" data-g="platform" aria-pressed="false">사이트별</button>
    </div>
    <button type="button" class="btn favBtn" id="favBtn" aria-pressed="false">★ 즐겨찾기만</button>
  </section>

  <section class="facets" aria-label="필터">
    <div class="facet"><span class="lbl">사이트</span><div class="chips" id="platChips"></div></div>
    <div class="facet"><span class="lbl">카테고리</span><div class="chips" id="catChips"></div></div>
    <div class="facet"><span class="lbl">지역</span><div class="chips" id="regChips"></div></div>
  </section>

  <main class="groups" id="groups"></main>
</div>

<dialog id="pdlg" aria-label="영상 재생">

    <div class="phead">

    </div>

    <p class="pnote" id="pNote"></p>

      <button type="button" class="btn small" id="pNext">다음 →</button>
      <span class="pos mono" id="pPos"></span>
      <span class="grow"></span>
      <a class="btn small" id="pOpen" href="#" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;text-decoration:none">원본에서 열기 ↗</a>

  </div>
</dialog>

<dialog id="sdlg" aria-labelledby="sTitle">
  <div class="sbox">
    <div class="dhead">
      <h2 id="sTitle">더 찾기</h2>

    </div>

    <div id="sSetup"></div>
    <div class="ctrl" id="sCtrl"></div>
    <div class="grid" id="sGrid"></div>
    <p class="smsg" id="sMsg" role="status"></p>
    <div class="sfoot"><button type="button" class="btn primary" id="sMore">더 찾기</button></div>
  </div>
</dialog>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="dlgForm" autocomplete="off">
    <div class="dhead">
      <h2 id="dlgTitle">레퍼런스 추가</h2>
      <button type="button" class="btn ghost small" id="dClose">닫기</button>
    </div>
    <div class="field">
      <label for="fUrl">링크</label>
      <textarea id="fUrl" rows="2" placeholder="https://…  (여러 개는 줄바꿈으로 구분)"></textarea>
      <p class="hint" id="urlHint"></p>
    </div>
    <div class="field">
      <label for="fTitle">제목</label>
      <input id="fTitle" type="text" placeholder="작품 제목 (YouTube·Vimeo는 링크에서 가져오기를 시도해요)">
    </div>
    <div class="row2">
      <div class="field" hidden><label for="fCredit">감독 · 아티스트 · 브랜드</label><input id="fCredit" type="text"></div>
      <div class="field"><label for="fDate">정리한 날짜</label><input id="fDate" type="date"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="fCat">카테고리</label>
        <input id="fCat" type="text" list="catList" placeholder="미분류">
        <datalist id="catList"></datalist>
      </div>
      <div class="field">
        <label for="fRegion">지역</label>
        <select id="fRegion"><option value="">미지정</option><option value="국내">국내</option><option value="해외">해외</option></select>
      </div>
    </div>
    <div class="quick" id="catQuick"></div>
    <div class="field" hidden>
      <label for="fTags">태그</label>
      <input id="fTags" type="text" placeholder="쉼표로 구분 · 예: 핸드헬드, 네온, 롱테이크">
    </div>
    <div class="field" hidden>
      <label for="fNote">메모</label>
      <textarea id="fNote" rows="3" placeholder="어디가 좋았는지, 가져다 쓸 포인트"></textarea>
    </div>
    <p class="err" id="dErr" role="alert" hidden></p>
    <div class="dfoot">
      <button type="button" class="btn danger" id="delBtn" hidden>삭제</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="dCancel">취소</button>
      <button type="submit" class="btn primary" id="dSave">저장</button>
    </div>
  </form>
</dialog>

<div class="toastBox"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>

        var known = knownUrls(), added = 0;
        list.forEach(function (b) {
          if (!b || typeof b.id !== 'string' || typeof b.url !== 'string') return;
          var n = normUrl(b.url);
          if (!n || known[n] || local.items[b.id] || local.deleted.indexOf(b.id) >= 0) return;
          local.items[b.id] = stripItem(clean(b.id, b)); known[n] = 1; added++;
        });
        if (added) { persist(); refreshItems(); render(); toast('새 레퍼런스 ' + added + '개가 도착했어요.'); }
      })
      .catch(function () { /* feed.json 없음 */ });
  }
  loadFeed();
})();
</script>
</body>
</html>
