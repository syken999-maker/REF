<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NEWX REF SITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#171719;--panel:#1f1f22;--line:#2f2f33;--fg:#edebe6;--mut:#8e8e93;--acc:#d3fd6a;--pin:#e0524a;--ig:#c561a8;--yt:#e8e8e8;--cap:#5aa7d8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
header{padding:28px 24px 14px}
h1{margin:0;font:900 clamp(30px,5vw,46px)/1 Archivo,"Arial Black",Impact,sans-serif;letter-spacing:-.025em;color:var(--fg)}h1 span{color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:rgba(23,23,25,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row.scroll{max-height:96px;overflow:auto}
button.c{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:0;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
button.c:hover{border-color:var(--mut)}
button.c.on{background:var(--acc);color:#171719;border-color:var(--acc);font-weight:700}button.c:hover{border-color:var(--acc)}button.c.on i{opacity:.7}
button.c.fav{outline:2px solid var(--acc);outline-offset:1px}button.c .st{margin-left:7px;opacity:.35;font-size:12px;cursor:pointer}button.c .st:hover,button.c.fav .st{opacity:1}button.c.fav:not(.on) .st{color:var(--acc)}button.c i{font-style:normal;opacity:.65;margin-left:5px;font-size:11.5px}
input.q{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:0;padding:5px 10px;font:inherit;font-size:13px;width:220px;max-width:100%}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:16px 24px 60px} 
.fs{font:inherit;cursor:pointer;border:0;border-radius:0;background:rgba(0,0,0,.62);color:#fff;line-height:1}
.fs.tile{position:absolute;right:6px;top:6px;z-index:3;font-size:15px;padding:3px 6px;opacity:0;transition:opacity .12s}
a.t:hover .fs.tile,div.t:hover .fs.tile,.t.isf .fs.tile,.fs.tile:focus-visible{opacity:1}
@media(hover:none){.fs.tile{opacity:1}}
.fs.on{color:var(--acc)}
.fs.hd{margin-left:10px;font-size:17px;padding:3px 8px;background:var(--bg)}
.fs.lb{margin-left:12px;font-size:17px;padding:2px 8px}
a.t.isf,div.t.isf{outline:2px solid var(--acc);outline-offset:-2px}
.feed.isf{border-color:var(--acc)}
main .emp{grid-column:1/-1;color:var(--mut);text-align:center;padding:80px 0;line-height:1.8}
main.feeds{display:block;max-width:1200px;margin:0 auto}
a.t,div.t{position:relative;display:block;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:0;overflow:hidden;text-decoration:none;color:inherit;cursor:pointer}
.t img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.t:hover img{transform:scale(1.04)}
.t:focus-visible{outline:2px solid var(--acc)}
.tag{position:absolute;left:6px;top:6px;font-size:10.5px;padding:1px 6px;border-radius:0;background:rgba(0,0,0,.72);color:#fff;letter-spacing:.03em;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.pin{border-left:3px solid var(--pin)}.tag.ig{border-left:3px solid var(--ig)}.tag.yt{border-left:3px solid var(--yt)}.tag.cap{border-left:3px solid var(--cap)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11.5px;line-height:1.3;opacity:0;transition:opacity .2s}
.t:hover .cap,.t:focus-visible .cap{opacity:1}
.cap b{display:block;font-weight:600}
.cap span{color:#c9c9c9}
.fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:4px;text-align:center;color:var(--mut);font-size:12px;background:repeating-linear-gradient(135deg,#16181d 0 10px,#1a1d23 10px 20px);padding:30px 8px 22px}
.fb strong{color:var(--fg);font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t.err .fb{display:flex}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);padding:0 5px;border-radius:0;font-size:11px}
.t.sq{aspect-ratio:4/5}
/* 인스타 작가별 피드 */
.artist{margin:0 0 56px}
.artist>h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:19px}
.artist>h2 a{color:var(--fg);text-decoration:none}
.artist>h2 small{color:var(--mut);font-weight:400;font-size:13px}
.artist>h2 .prof{margin-left:auto;font-size:12.5px;color:var(--acc);font-weight:400}
.feed{margin:0 0 34px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:0}
.feed .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:6px;font-size:13px}
.feed .hd b{font-weight:600}
.feed .hd span{color:var(--mut)}
.feed .hd a{margin-left:auto;color:var(--acc);text-decoration:none;white-space:nowrap}
.feed .hd a:hover{text-decoration:underline}
.feed p.cp{margin:0 0 12px;color:var(--mut);font-size:12.5px;max-width:90ch;overflow-wrap:anywhere}
.sl{display:flex;flex-wrap:wrap;gap:8px}
.sl img,.sl video{height:340px;width:auto;max-width:100%;border-radius:0;background:#0b0c0e;display:block;cursor:zoom-in}
.sl video{cursor:default}
.sl .more{align-self:center;color:var(--mut);font-size:12.5px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.wgrid .t{aspect-ratio:4/5}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:78vh;object-fit:contain;border-radius:0}
#lb .m{color:#ddd;font-size:13px;text-align:center;max-width:90ch}
#lb .m a{color:var(--acc)}
#lb .x{position:absolute;right:18px;top:12px;font-size:26px;cursor:pointer;color:#fff;background:none;border:0}
@media(max-width:560px){.bar{position:static}header,.bar,main{padding-left:16px;padding-right:16px}main{grid-template-columns:repeat(2,1fr)}main.feeds{display:block}.sl img,.sl video{height:240px}.feed{padding:12px}}
@media(hover:none){.t .cap{opacity:1}}
</style></head><body>
<header><h1>NEWX <span>REF</span> SITE</h1></header>
<div class="bar"><div class="row" id="plat"></div><div class="row" id="grp"></div><div class="row" id="cats"></div></div>
<main id="grid"></main>
<div id="lb"><button class="x" id="lbx" aria-label="닫기">×</button><img id="lbi" alt=""><div class="m" id="lbm"></div></div>
<datalist id="dl"></datalist>
<script>
function main(){
const NX=window.NX;
const PC={L:'로우앵글',T:'탑다운',D:'더치앵글',F:'프레임 속 프레임',W:'와이드·초광각',C:'클로즈업',S:'실루엣·역광',Y:'대칭',M:'MV 스타일',O:'오버숄더',R:'반사',N:'야간',H:'하이앵글',A:'애니 시네마틱',B:'애니 영화 장면',G:'극장판·지브리',U:'3D 애니',V:'애니 MV',Z:'스타일라이즈 애니',P:'애니 앵글'};
const YC={S:'영화 명장면 모음',M:'MV·단편·영상',T:'촬영 분석·강의',A:'애니 장면 모음',V:'애니 MV',O:'애니 단편'};
const WN={film:'브랜드필름',ad:'광고',meme:'밈'};
const PN={pin:'핀터레스트',ig:'인스타그램',yt:'유튜브 영상',cap:'영상캡처'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function dstr(ts){if(!ts)return'';const d=new Date(ts*1000);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
/* 타일 목록: 핀터레스트, 영상, 영상캡처 */
const items=[];
const seenH=new Set();
NX.pin.forEach(([c,id,h])=>{if(seenH.has(h))return;seenH.add(h);items.push({p:'pin',c:PC[c]||c,u:'https://www.pinterest.com/pin/'+id+'/',i:'https://i.pinimg.com/736x/'+h.slice(0,2)+'/'+h.slice(2,4)+'/'+h.slice(4,6)+'/'+h+'.jpg'})});
const YT={};
NX.yt.forEach(([id,t,ch,d,k])=>{YT[id]={t,ch,d,k};items.push({p:'yt',c:YC[k]||k,u:'https://www.youtube.com/watch?v='+id,i:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg',t:t,ch:ch,d:d})});
Object.keys(NX.yf).forEach(vid=>{const y=YT[vid]||{t:vid,ch:'',k:'M'};Object.keys(NX.yf[vid]).sort().forEach(f=>{const m=f.match(/^(\d+)_(\d+)\.jpg$/);if(!m)return;const sec=+m[2];items.push({p:'cap',c:YC[y.k]||'기타',u:'https://www.youtube.com/watch?v='+vid+'&t='+sec+'s',i:NX.yf[vid][f],t:y.t,ch:y.ch,ts:fmt(sec)})})});
/* 인스타: 작가별 */
const AR=NX.ig.artists; // [{u,fn,posts:[...]}]
const WH=NX.wh; // [[g,file,ratio]]
const UG={};AR.forEach(a=>UG[a.u]=a.g||'기존 수집');const GO=['추천','광고','뮤직비디오','시네마틱·촬영·VFX','감독·촬영감독','제작사·스튜디오','기존 수집'];
const igCount=AR.reduce((n,a)=>n+a.posts.length,0)+WH.length;
let fp='all',fc='all',fa='all',fg='all',fq='',lbList=[],lbIdx=0;
let CS='c',FV=new Set();try{FV=new Set(JSON.parse(localStorage.nx_fav||'[]'))}catch(e){}
const fk=v=>CS+':'+v,isFav=v=>FV.has(fk(v));
function favSave(){try{localStorage.nx_fav=JSON.stringify([...FV])}catch(e){}}
function favFirst(a,f){const g=a.filter(x=>isFav(f(x))),r=a.filter(x=>!isFav(f(x)));return g.concat(r)}
const ik=x=>(x.p==='wh'||!x.u)?x.i:x.u;
let favCountFn=()=>{};
function starBtn(k,cls,cb){const b=document.createElement('button');b.type='button';b.className='fs '+cls;
 const sy=()=>{const f=FV.has('i:'+k);b.textContent=f?'★':'☆';b.classList.toggle('on',f);b.title=f?'즐겨찾기 해제':'즐겨찾기'};sy();
 b.onclick=e=>{e.preventDefault();e.stopPropagation();const s='i:'+k;FV.has(s)?FV.delete(s):FV.add(s);favSave();sy();favCountFn();cb&&cb(FV.has(s))};return b}
function chip(box,label,val,n,cur,fn){const sc=CS,b=document.createElement('button');b.className='c'+(cur===val?' on':'')+(val!=='all'&&val!=='fav'&&sc!=='x'&&isFav(val)?' fav':'');b.innerHTML=esc(label)+(n!=null?'<i>'+n+'</i>':'');b.dataset.v=val;b.onclick=()=>fn(val);
 if(val!=='all'&&val!=='fav'&&sc!=='x'){const st=document.createElement('span');st.className='st';st.textContent=isFav(val)?'★':'☆';st.title='즐겨찾기';st.onclick=e=>{e.stopPropagation();const k=sc+':'+val;FV.has(k)?FV.delete(k):FV.add(k);favSave();render()};b.appendChild(st)}
 box.appendChild(b)}
function openLb(list,i){lbList=list;lbIdx=i;const x=list[i];const im=$('#lbi');im.onerror=()=>{im.onerror=null;if(x.i)im.src=x.i};im.src=x.full||x.i;$('#lbm').innerHTML=(x.t?'<b>'+esc(x.t)+'</b> ':'')+(x.ts?'<span>'+x.ts+'</span> ':'')+(x.u?'<a href="'+x.u+'" target="_blank" rel="noopener noreferrer">원본 열기 ↗</a>':'');{const bt=starBtn(ik(x),'lb',()=>{if(fp==='fav')render()});$('#lbm').appendChild(bt)}$('#lb').classList.add('on')}
$('#lbx').onclick=()=>$('#lb').classList.remove('on');
$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').classList.remove('on')};
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')$('#lb').classList.remove('on');if(e.key==='ArrowRight'&&lbIdx<lbList.length-1)openLb(lbList,lbIdx+1);if(e.key==='ArrowLeft'&&lbIdx>0)openLb(lbList,lbIdx-1)});
function tile(x,list){
 const lb=x.p==='cap'||x.p==='wh';
 const a=document.createElement(lb?'div':'a');a.className='t'+(x.sq?' sq':'');
 if(lb){a.tabIndex=0;a.onclick=()=>openLb(list,list.indexOf(x));a.onkeydown=e=>{if(e.key==='Enter')a.onclick()}}else{a.href=x.u;a.target='_blank';a.rel='noopener noreferrer'}
 {const im=document.createElement('img');im.loading='lazy';im.decoding='async';im.referrerPolicy='no-referrer';im.alt='';im.src=x.i;if(x.p==='yt'){im.onerror=()=>a.classList.add('err')}a.appendChild(im)}
 if(x.p==='yt'){const fb=document.createElement('div');fb.className='fb';fb.innerHTML='<strong>'+esc(x.t)+'</strong><span>'+esc(x.ch)+'</span>';a.appendChild(fb)}
 const tg=document.createElement('span');tg.className='tag '+(x.p==='wh'?'ig':x.p);tg.textContent=x.c;a.appendChild(tg);
 if(x.t){const cp=document.createElement('div');cp.className='cap';if(x.p==='cap'||x.p==='yt'){const b=document.createElement('b');b.textContent=x.t;cp.appendChild(b)}const s=document.createElement('span');s.textContent=x.p==='cap'?(x.ts+' · '+x.ch):x.p==='yt'?x.ch:x.t;cp.appendChild(s);a.appendChild(cp)}
 if(x.d){const d=document.createElement('span');d.className='dur';d.textContent=x.d;a.appendChild(d)}
 {const k=ik(x);if(FV.has('i:'+k))a.classList.add('isf');a.appendChild(starBtn(k,'tile',on=>{a.classList.toggle('isf',on);if(fp==='fav'&&!on)render()}))}
 return a}
function feedEl(a,p){
 const el=document.createElement('article');el.className='feed';
 const link='https://www.instagram.com/p/'+p.c+'/';
 el.innerHTML='<div class="hd"><b>@'+esc(a.u)+'</b><span>'+esc(dstr(p.ts))+(p.lk!=null?' · ♥ '+p.lk.toLocaleString():'')+(p.n>p.s.length?' · 슬라이드 '+p.n+'장 중 '+p.s.length+'장':'')+'</span><a href="'+link+'" target="_blank" rel="noopener noreferrer">게시물 열기 ↗</a></div>'+(p.cap?'<p class="cp">'+esc(p.cap)+'</p>':'');
 if(FV.has('i:'+link))el.classList.add('isf');el.querySelector('.hd').appendChild(starBtn(link,'hd',on=>el.classList.toggle('isf',on)));
 const sl=document.createElement('div');sl.className='sl';
 const imgs=p.s.filter(s=>s.k==='i'||(s.k==='v'&&!s.f)).map(s=>({i:s.f||s.p,t:'@'+a.u,u:link}));
 const ilist=p.s.filter(s=>s.k==='i').map(s=>({i:s.f,t:'@'+a.u,u:link}));
 p.s.forEach(s=>{
  if(s.k==='v'&&s.f){const v=document.createElement('video');v.controls=true;v.preload='none';v.playsInline=true;v.loop=true;if(s.p)v.poster=s.p;if(s.w&&s.h)v.style.aspectRatio=s.w+'/'+s.h;v.src=s.f;sl.appendChild(v)}
  else if(s.k==='i'||s.p){const im=document.createElement('img');im.loading='lazy';im.decoding='async';im.alt='';im.src=s.f||s.p;if(s.w&&s.h)im.style.aspectRatio=s.w+'/'+s.h;const k=ilist.findIndex(z=>z.i===(s.f));im.onclick=()=>{if(k>=0)openLb(ilist,k)};sl.appendChild(im)}
 });
 el.appendChild(sl);return el}
function renderIG(g){
 const gp=$('#grp');gp.innerHTML='';CS='g';
 const gcnt={};AR.forEach(a=>{const k=a.g||'기존 수집';gcnt[k]=(gcnt[k]||0)+a.posts.length});
 chip(gp,'전체 그룹','all',igCount,fg,v=>{fg=v;fa='all';render()});
 for(const k of favFirst(GO.filter(k=>gcnt[k]),x=>x))chip(gp,k,k,gcnt[k],fg,v=>{fg=v;fa='all';render()});
 const ARF=AR.filter(a=>fg==='all'||(a.g||'기존 수집')===fg);
 const cs=$('#cats');cs.innerHTML='';
 CS='a';chip(cs,fg==='all'?'전체 작가':'그룹 전체','all',fg==='all'?igCount:gcnt[fg],fa,v=>{fa=v;render()});
 if(fg==='all')chip(cs,'workhard','workhard',WH.length,fa,v=>{fa=v;render()});
 const top=favFirst(ARF.filter(a=>isFav(a.u)).concat(ARF.slice(0,fg==='all'?30:90).filter(a=>!isFav(a.u))),a=>a.u);
 top.forEach(a=>chip(cs,'@'+a.u,a.u,a.posts.length,fa,v=>{fa=v;render()}));
 if(fa!=='all'&&fa!=='workhard'&&!top.some(a=>a.u===fa)){const a=ARF.find(z=>z.u===fa);if(a)chip(cs,'@'+a.u,a.u,a.posts.length,fa,v=>{fa=v;render()})}
 cs.className='row scroll';
 const inp=document.createElement('input');inp.className='q';inp.setAttribute('list','dl');inp.placeholder='아이디 검색';inp.value=fq;inp.onchange=()=>{const v=inp.value.replace(/^@/,'').trim();fq=v;const hit=v==='workhard'||AR.some(a=>a.u===v);if(hit){fa=v;render()}else if(!v){fa='all';render()}};
 cs.appendChild(inp);
 const dl=$('#dl');if(!dl.children.length){const o=document.createElement('option');o.value='workhard';dl.appendChild(o);AR.forEach(a=>{const o=document.createElement('option');o.value=a.u;dl.appendChild(o)})}
 g.className='feeds';
 const fr=document.createDocumentFragment();
 const secWH=()=>{
  const sec=document.createElement('section');sec.className='artist';
  sec.innerHTML='<h2><a>workhard</a><small>'+WH.length+'장</small></h2>';
  const sub=document.createElement('div');sub.className='row';sub.style.marginBottom='14px';
  sec.appendChild(sub);
  const gr=document.createElement('div');gr.className='wgrid';sec.appendChild(gr);
  const draw=()=>{sub.innerHTML='';CS='w';chip(sub,'전체','all',WH.length,fc,v=>{fc=v;draw()});for(const k of favFirst(Object.keys(WN),x=>x))chip(sub,WN[k],k,WH.filter(w=>w[0]===k).length,fc,v=>{fc=v;draw()});
   gr.innerHTML='';const L=WH.filter(w=>fc==='all'||w[0]===fc).map(w=>({p:'wh',c:WN[w[0]],i:'wh/'+w[1],sq:true}));L.forEach(x=>gr.appendChild(tile(x,L)))};
  draw();return sec};
 const secA=a=>{
  const sec=document.createElement('section');sec.className='artist';
  sec.innerHTML='<h2><a href="https://www.instagram.com/'+esc(a.u)+'/" target="_blank" rel="noopener noreferrer">@'+esc(a.u)+'</a>'+(a.fn?'<small>'+esc(a.fn)+'</small>':'')+'<small>게시물 '+a.posts.length+'개</small><a class="prof" href="https://www.instagram.com/'+esc(a.u)+'/" target="_blank" rel="noopener noreferrer">프로필 열기 ↗</a></h2>';
  a.posts.forEach(p=>sec.appendChild(feedEl(a,p)));return sec};
 if(fa==='all'){if(fg==='all')fr.appendChild(secWH());ARF.forEach(a=>fr.appendChild(secA(a)))}
 else if(fa==='workhard')fr.appendChild(secWH());
 else{const a=AR.find(z=>z.u===fa);if(a)fr.appendChild(secA(a))}
 g.appendChild(fr)}
function render(){
 const g=$('#grid');g.innerHTML='';g.className='';
 const pl=$('#plat');pl.innerHTML='';if(fp!=='ig')$('#grp').innerHTML='';

생각되며- 재밌게 봐주세요🙇🏻‍♂️\n\n무인양품 x 하라 켄야 수평선 컬렉션(비움으로서 채움)\n\n포카리 스웨트\n\n히비야 화단(텍스트의 시각화) \n\n이다텐~ 도쿄올림픽 이야기~(드라마 포스터)\n\n도시바 전구","s":[{"k":"i","f":"igp/DdBrTZhlMsf_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DdBrTZhlMsf_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DdBrTZhlMsf_2.jpg","w":600,"h":750}]},{"c":"DbapgJqE_2n","ts":1785413115,"lk":6535,"n":18,"cap":".\n블로그가 요즘 재밌는 일을 벌이고 있는 것 같아 2달 만에 다시 돌아왔습니다. \n\n저도 제목만 쓸 게 아니라 블로그를 좀 날것이지만 있는 그대로의 저를 나타내는 용도로 좀 활용해 볼까 봐요. \n\n해결하지 못한 것 투성이라 두근대는 하루 하루를(사실 발등에 불 떨어진 것 투성이라 미칠 노릇) 보내고 있는 대학생의 일상이 얼마나 재밌을지 감도 안 오지 않으십니까.........!\n\n여튼 곧 8월도 다가오는데 마음껏 써주실 거라","s":[{"k":"i","f":"igp/DbapgJqE_2n_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DbapgJqE_2n_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DbapgJqE_2n_2.jpg","w":600,"h":750}]},{"c":"DfE92BmFE-m","ts":1793275517,"lk":4547,"n":18,"cap":".\n느슨해진 글쓰기에 긴장감을 주고자\n약 3달 만에 다시 돌아온 블로그 제목입니다. \n\n참고하시어 야무지게 활용하시길 바라며..아 요즘 날씨가 엄청 춥더라구요(설악산은 첫눈도 내렸다면서요?) 따뜻하게 입고 다니시구 혹시나 길 가다 저 만나면 붕어빵 사드리겠습니다. \n\n그럼 모두 좋은 하루 보내세요🏃🏻💨\n\nThanks to @daeriyakii \n(박대리님 이모지 아니였음 쓸 생각도 못했을 문구!) \n\n진짜로 우리 좋았잖아","s":[{"k":"i","f":"igp/DfE92BmFE-m_0.jpg","w":600,"h":743},{"k":"i","f":"igp/DfE92BmFE-m_1.jpg","w":600,"h":743},{"k":"i","f":"igp/DfE92BmFE-m_2.jpg","w":600,"h":743}]},{"c":"DfO8dDlFAUU","ts":1793610332,"lk":1180,"n":5,"cap":".\n엊그제 삼성 캐나다가 아이폰 듀오의 상처에(디스플레이 파손 및 결함) 소금을 그냥 냅다 들이 붓는 광고를 전개했습니다. \n\n상당히 직관적이어서 놀랐는데 메시지도 좀 세게 전달하더라구요?\n“접는 건 우리에게 식은 죽 먹기”, “너넨 그냥 접어라(언어유희인 거\n같음)”, “우린 8번이나 접었는데”, “갈아타세요 Z 폴드8로” 등 Z 폴드 시리즈를 8세대까지 이어오며 쌓은 폴더블 기술력과 노하우를 강조함과 동시에 아이폰은 그냥 ","s":[{"k":"i","f":"igp/DfO8dDlFAUU_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfO8dDlFAUU_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfO8dDlFAUU_2.jpg","w":600,"h":750}]},{"c":"DciwW9pFER7","ts":1787832628,"lk":1088,"n":20,"cap":".\n이 악물고 시리즈 8번째 편입니다. \n\n작년 12월을 끝으로 이런 포맷으로는\n거의 8개월 만에 다시 돌아온 거 같은데,\n\n실력이 예전만 못하더라도 변함없는 진심으로 꾹꾹\n눌러 담아 적었으니 예쁘게 봐주시길 바라며, 항상 감사랑합니다..🫶\n\n포카리스웨트\n\n서울교통공사\n\n듀오링고\n\n광고 카피는 아니지만.. 개인적으로 팬이기도 하구.. 최근 릴스를 너무 인상 깊게 봐가지고 한번 써봤습니다🌞\n\n말해보카\n\n메가스터디\n\n여기어때\n","s":[{"k":"i","f":"igp/DciwW9pFER7_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DciwW9pFER7_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DciwW9pFER7_2.jpg","w":600,"h":750}]},{"c":"DfmIJGzE0IF","ts":1794388212,"lk":3,"n":20,"cap":".\n11월의 시작을 알리는 광고들을 보고 가십시오👀\n\n투썸플레이스 \n-\n확실히 스초생은 겨울이 퍼컬인 것 같아요. 캠페인 “홀리데이를, 홀리데이답게(TwoDay Is Holiday)” 덕분에 다가올 연말의 설렘을 다시금 일깨우는 계기가 되지 않았나 싶고, 와앙 ~ 욤뇸뇸뇸 먹는 원희가 킬포이니 꼭 보시길 추천드립니다. \n\n알바몬 \n-\n스윙스랑 최예나가 광고 모델이라니.. 너~무 의외의 조합이라 오히려 광고의 전개가 궁금해져서","s":[{"k":"i","f":"igp/DfmIJGzE0IF_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfmIJGzE0IF_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfmIJGzE0IF_2.jpg","w":600,"h":750}]},{"c":"DfjiwwVFAU6","ts":1794301505,"lk":3,"n":17,"cap":".\n최근 전공 수업의 일환으로 국내외 광고를 볼 일이 좀 많았었는데요,\n그 과정에서 가장 흥미로웠던 건, 다름 아닌 애플이었습니다.\n\n단순 카피라이팅을 넘어 원문의 의도, 어조를 각기 다른 문화에 맞춰 써야 하는 애플의 트랜스크리에이션 특징상 각 나라의 톤앤무드를 알아가는 데 있어 이만한 예시가 없는 것 같은데(물론 일반화x)\n\n영미권은 iMac의 컬러 라인업을 알파벳 L이나 I로 연달아 나타내는 반면, 중국이나 일본처럼 마땅","s":[{"k":"i","f":"igp/DfjiwwVFAU6_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfjiwwVFAU6_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfjiwwVFAU6_2.jpg","w":600,"h":750}]},{"c":"Dfg-IGVlMkx","ts":1794215189,"lk":3,"n":16,"cap":".\n지금으로부터 약 1년 전, 세계 6대 마라톤 중 하나인 시카고 마라톤이\n열렸었는데요. 그 당시 화제였던 건 다름 아닌 나이키의 옥외 광고였습니다. \n\n코스 전 구간이 참가자들을 응원하는 문구로 가득 차는가 하면, 직설적인 문구로 사기를 한껏 끌어 올리기도, 완주하는 과정에서 겪을 수 있는 온갖 감정 등을 문구로 나타내기도 했죠. \n\n근데 이번에 2026 JTBC 서울 마라톤에서 나이키가 메인\n스폰서로 들어옴으로써 이와 동일","s":[{"k":"i","f":"igp/Dfg-IGVlMkx_0.jpg","w":600,"h":750},{"k":"i","f":"igp/Dfg-IGVlMkx_1.jpg","w":600,"h":750},{"k":"i","f":"igp/Dfg-IGVlMkx_2.jpg","w":600,"h":750}]}],"g":"광고"},{"u":"artistry.agency","fn":"","posts":[{"c":"DYu_q2okj83","ts":1779653374,"lk":5120,"n":10,"cap":"Bad Thoughts Season 2 is streaming now on @netflix\n\nWe had so much fun making this and I’m so grateful to be a part of this talented team of artists. @seguratom @jeremykonner @thatdamnrami @tyler_cornack, thank you for the incredible sandbo","s":[{"k":" :"i","f":"igp/DfTmkJgIOgq_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfTmkJgIOgq_2.jpg","w":600,"h":750}]},{"c":"DfbeRbQIIln","ts":1794030716,"lk":555,"n":9,"cap":"I 가을 착장 잡기술 모음집 I\n\n이젠 정말 짧아진 가을이지만, 가을만큼 옷을 사랑하는 사람들이 사랑하는 계절은 없다고도 생각하는데요. 올해 가을은 늘 말해왔듯이 정말 다양한 스타일이 공존하고, 본인에게 맞는 스타일을 찾아가는 계절이라는 생각이 들었어요.\n\n저도 하나하나 익혀나가고 그런 과정에서 배운 조금 더 착장이 풍성해지고 더 멋있어지기 위한 잡기술들이 소소하게 존재했던 것 같은데요. 오늘은 제가 이런 저런 시행착오를 겪으","s":[{"k":"i","f":"igp/DfbeRbQIIln_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfbeRbQIIln_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfbeRbQIIln_2.jpg","w":600,"h":750}]},{"c":"DflzTLBIFEk","ts":1794377284,"lk":492,"n":9,"cap":"I 발매 예정 예쁜 옷 I\n\n이번 가을과 겨울에는 정말 이를 간 것 같은 제품들이 많이 발매되고 있는 것 같은데요. 늘 그렇듯 인스타를 통해서 다른 분들의 계정을 염탐하면서 봤던 제품들과 예전부터 미리 보고 기다렸던 제품들이 있는데요.\n\n옛날에 비해 어떤 발매 소식을 엄청 기다렸다가 무언갈 구매하지는 않지만, 그럼에도 늘 새로운 제품의 발매 소식이 들려오면 둘러보게 되는 것 같긴 합니다. 무수히 많았던 발매 소식 중 제 마음에","s":[{"k":"i","f":"igp/DflzTLBIFEk_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DflzTLBIFEk_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DflzTLBIFEk_2.jpg","w":600,"h":750}]},{"c":"DfjHM3nILYR","ts":1794287055,"lk":445,"n":20,"cap":"I 삿포로 트스로그 (상) I\n\n오랜만에 돌아온 트스로그인데, 이번에는 일본 여행을 다녀왔어요. 바로 삿포로에 짱구대디님과 사히님과 함께 다녀왔는데요. 이전 고베와 오사카를 다녀온 이후로 반년만에 또 다시 함께 여행을 다녀오게 되었는데, 너무 소중한 추억을 쌓게 되어 일기장 느낌으로 트스로그를 적어볼게요.\n\n이번 여행의 컨셉은 힐링이었던 것 같은데요. 저도 평소에 여행을 다니다보면 무언가에 쫓기듯 급하게 여행을 다녔다면 이번에","s":[{"k":"i","f":"igp/DfjHM3nILYR_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfjHM3nILYR_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfjHM3nILYR_2.jpg","w":600,"h":750}]},{"c":"DfO4fwSoDO3","ts":1793608257,"lk":437,"n":11,"cap":"#광고 I 무탠다드 꿀템 I\n\n올해 가장 두드러지는 트렌드는 바로 바지 핏이 줄어드는 거라고 볼 수 있는데요. 그러면서 자연스레 아우터의 핏도 줄어들고, 레이어드 착장이 많이 보이는 것 같습니다.\n\n그러다보니 레이어드용 얇은 후디를 찾는 분들이 많아지시고, 포인트 컬러를 활용하거나 레이어드 그 자체에 활용할 무채색 후디를 찾는 분도 많으신 것 같은데요. 오늘은 무탠다드에서 찾은 의외의 꿀템을 소개드려볼까 합니다.\n\n바로 플리스","s":[{"k":"i","f":"igp/DfO4fwSoDO3_0.jpg","w":600,"h":750},{"k":"i","f":"igp/DfO4fwSoDO3_1.jpg","w":600,"h":750},{"k":"i","f":"igp/DfO4fwSoDO3_2.jpg","w":600,"h":750}]}],"
